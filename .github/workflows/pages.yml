# Publishes the site on every push to main: only the web/ folder, so the daily is at the root
# (yusufsocal.github.io/Purrjury/, and purrjury.com/ once the domain is connected).
# For this to be used, the repo's Settings > Pages > Source must be "GitHub Actions".
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:   # a "Run workflow" button in the Actions tab, to publish by hand

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push waits for the one running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
